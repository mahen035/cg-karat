server:
  port: 8081

spring:
  application:
    name: product-catalog-service
  datasource:
    url: jdbc:postgresql://postgres-container:5432/demodb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: demo123
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
    hibernate:
      ddl-auto: update
    show-sql: true
orbit:
  shortlink:
    base-url: http://localhost:8080/r


